{# Light / dark switch. The choice is remembered in this browser (static/js/theme.js). #}
<span class="tooltip tooltip-bottom" data-tip="Switch between light and dark theme">
  <button type="button" id="{{ toggle_id|default:'theme-toggle' }}" class="btn btn-ghost btn-sm btn-circle" x-data="themeToggle()" @click="toggle()" @theme-changed.window="dark = $event.detail.dark"
          aria-label="Switch between light and dark theme">
    <svg x-show="dark" x-cloak class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg x-show="!dark" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
</span>
