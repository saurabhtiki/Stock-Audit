{# "Me" menu rows: profile, password, log out. Used in the top bar and the phone side menu. #}
<li><a href="{% url 'accounts:profile' %}" title="Change your photo and see your companies and rights">My profile and photo</a></li>
<li><a href="{% url 'accounts:password_change' %}" title="Pick a new password">Change password</a></li>
<li>
  {# The button itself is the menu row, so a click anywhere on the row logs out. #}
  <button type="submit" form="logout-form" title="Log out and go to the login page"
          x-data="{ busy: false }" @pageshow.window="busy = false" :disabled="busy" :aria-busy="busy"
          @click.prevent="if (!busy) { busy = true; $el.form.requestSubmit() }">
    <span x-show="!busy">Log out</span>
    <span x-show="busy" x-cloak class="flex items-center gap-2"><span class="loading loading-spinner loading-xs"></span>Logging out…</span>
  </button>
</li>
