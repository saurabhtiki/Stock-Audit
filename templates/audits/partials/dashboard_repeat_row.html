{% load humanize %}
<tr>
  <td class="dt-sticky font-bold">{{ row.branch_code }}</td>
  <td>{% if row.query_id %}<a class="link link-primary font-bold" href="{% url 'audits:query_detail' row.query_id %}" title="Open the latest query: it shows this item's history across audits">{{ row.item_code }}</a>{% else %}{{ row.item_code }}{% endif %}</td>
  <td>{{ row.description }}</td>
  <td class="text-right"><span class="badge {% if row.streak >= 3 %}badge-error{% else %}badge-warning{% endif %}" title="Audits in a row with Excess / Shortage">{{ row.streak }}</span></td>
  <td class="text-right font-bold {% if row.total_value < 0 %}text-error{% else %}text-success{% endif %}">{{ row.total_value|floatformat:2|intcomma }}</td>
</tr>
