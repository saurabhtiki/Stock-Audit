{% extends "base.html" %}
{% block title %}Audits{% endblock %}
{% block content %}
<div class="mb-4 flex flex-wrap items-center justify-between gap-2">
  <h1 class="text-2xl font-bold">Audits</h1>
  <div class="flex flex-wrap items-center gap-2">
    <label class="label cursor-pointer gap-2 text-sm" title="Cancelled audits are hidden unless this is ticked">
      <input type="checkbox" class="toggle toggle-sm toggle-primary" {% if show_cancelled %}checked{% endif %}
             onchange="const url = new window.URL(location.href); url.searchParams.delete('page');
                       this.checked ? url.searchParams.set('cancelled', '1') : url.searchParams.delete('cancelled');
                       location.href = url;">
      Show cancelled
    </label>
    <span class="tooltip tooltip-bottom" data-tip="Excel file with the 5 columns to copy your ERP report into">
      <a href="{% url 'audits:erp_template' %}" class="btn btn-outline btn-secondary">ERP template</a>
    </span>
    {% if can_create %}<a href="{% url 'audits:audit_create' %}" class="btn btn-primary" title="Create an audit for one of your Branches">New audit</a>{% endif %}
  </div>
</div>
{% include "audits/partials/audit_table.html" %}
{% endblock %}
