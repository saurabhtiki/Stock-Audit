<tr id="company-{{ row.pk }}" class="{% if not row.is_active %}opacity-60{% endif %}">
  <td class="dt-sticky">
    <div class="flex items-center gap-3">
      {% if row.logo %}<img src="{{ row.logo.url }}" alt="" class="h-8 w-8 rounded object-contain">{% endif %}
      <span class="font-bold">{{ row.name }}</span>
    </div>
  </td>
  <td class="max-w-xs truncate text-sm text-base-content/70" title="{{ row.address }}">{{ row.address|default:"–" }}</td>
  <td class="text-right"><a class="link" href="{% url 'core:branch_list' %}?company_name={{ row.name|urlencode }}" title="See this company's Branches">{{ row.branch_count }}</a></td>
  <td>
    {% if row.is_active %}<span class="badge badge-soft badge-success">Active</span>
    {% else %}<span class="badge badge-soft">Inactive</span>{% endif %}
  </td>
  <td class="whitespace-nowrap text-right">
    <a href="{% url 'core:company_edit' row.pk %}" class="btn btn-sm btn-outline btn-primary" title="Change name, address or logo">Edit</a>
    <span class="tooltip tooltip-left" data-tip="{% if row.is_active %}Hides its Branches and blocks users' access. Nothing is deleted.{% else %}Turns the company and its Branches back on.{% endif %}">
      <button class="btn btn-sm {% if row.is_active %}btn-outline btn-warning{% else %}btn-success{% endif %}"
              hx-post="{% url 'core:company_toggle' row.pk %}"
              hx-target="#company-{{ row.pk }}" hx-swap="outerHTML"
              hx-confirm="{% if row.is_active %}Deactivate {{ row.name }}? Its users will lose access to it.{% else %}Activate {{ row.name }} again?{% endif %}">
        {% if row.is_active %}Deactivate{% else %}Activate{% endif %}
      </button>
    </span>
  </td>
</tr>
