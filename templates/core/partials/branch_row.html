<tr id="branch-{{ row.pk }}" class="{% if not row.is_usable %}opacity-60{% endif %}">
  <td class="dt-sticky font-bold">{{ row.code }}</td>
  <td>{{ row.name }}</td>
  <td>{{ row.company.name }}</td>
  <td>
    {% if row.is_usable %}<span class="badge badge-soft badge-success">Active</span>
    {% elif not row.company.is_active %}
      <span class="tooltip" data-tip="The company is inactive, so this Branch is off too."><span class="badge badge-soft">Company inactive</span></span>
    {% else %}<span class="badge badge-soft">Inactive</span>{% endif %}
  </td>
  <td class="whitespace-nowrap text-right">
    <a href="{% url 'core:branch_edit' row.pk %}" class="btn btn-sm btn-outline btn-primary" title="Change this Branch's name or code">Edit</a>
    <span class="tooltip tooltip-left" data-tip="{% if row.is_active %}Hides this Branch from all users. Nothing is deleted.{% else %}Turns this Branch back on.{% endif %}">
      <button class="btn btn-sm {% if row.is_active %}btn-outline btn-warning{% else %}btn-success{% endif %}"
              hx-post="{% url 'core:branch_toggle' row.pk %}"
              hx-target="#branch-{{ row.pk }}" hx-swap="outerHTML"
              hx-confirm="{% if row.is_active %}Deactivate Branch {{ row.code }}?{% else %}Activate Branch {{ row.code }} again?{% endif %}">
        {% if row.is_active %}Deactivate{% else %}Activate{% endif %}
      </button>
    </span>
  </td>
</tr>
