<tr id="department-{{ row.pk }}" class="{% if not row.is_active or not row.company.is_active %}opacity-60{% endif %}">
  <td class="dt-sticky font-bold">{{ row.name }}</td>
  <td>{{ row.company.name }}</td>
  <td>
    {% if row.is_active %}<span class="badge badge-soft badge-success">Active</span>
    {% else %}<span class="badge badge-soft">Inactive</span>{% endif %}
  </td>
  <td class="whitespace-nowrap text-right">
    <a href="{% url 'core:department_edit' row.pk %}" class="btn btn-sm btn-outline btn-primary" title="Rename this department">Edit</a>
    <span class="tooltip tooltip-left" data-tip="{% if row.is_active %}Stops it being offered for new users. Users already in it keep it.{% else %}Offers this department again.{% endif %}">
      <button class="btn btn-sm {% if row.is_active %}btn-outline btn-warning{% else %}btn-success{% endif %}"
              hx-post="{% url 'core:department_toggle' row.pk %}"
              hx-target="#department-{{ row.pk }}" hx-swap="outerHTML"
              hx-confirm="{% if row.is_active %}Deactivate department {{ row.name }}?{% else %}Activate department {{ row.name }} again?{% endif %}">
        {% if row.is_active %}Deactivate{% else %}Activate{% endif %}
      </button>
    </span>
  </td>
</tr>
